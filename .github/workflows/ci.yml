# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked symlinks
        run: python -B tools/ci_integrity.py --symlinks-only
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select checks from changed paths
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE: ${{ github.event.before }}
        run: python -B tools/ci_changes.py
      # No exam-source downloads or TeX installation; validators use the checkout only.
      - name: Validate structure and Markdown prose
        if: steps.changes.outputs.validate == 'true'
        run: python -B tools/validate.py --write-status
      - name: Check generated status is current
        if: steps.changes.outputs.validate == 'true'
        run: |
          git cat-file -e HEAD:docs/STATUS.md
          git cat-file -e HEAD:docs/status.json
          STATUS=$(git status --porcelain --untracked-files=all --ignored -- docs/STATUS.md docs/status.json)
          if [ -n "$STATUS" ]; then
            echo "$STATUS"
            exit 1
          fi
      - name: Discover all unit tests
        if: steps.changes.outputs.tests == 'true'
        # Empty discovery is valid until test files arrive on main (also on Python 3.14+).
        run: >-
          python -B -c "import unittest; suite = unittest.defaultTestLoader.discover('tools', pattern='test_*.py'); result = unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"
      - name: Check build script Python syntax (no TeX)
        if: steps.changes.outputs.build == 'true'
        run: python -B -c "from pathlib import Path; compile(Path('tools/build.py').read_bytes(), 'tools/build.py', 'exec')"
      - name: Check generated blobs and whole working tree
        run: python -B tools/ci_integrity.py docs/STATUS.md docs/status.json
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ steps.changes.outputs.whitespace_base }}
        run: git diff --check "$BASE_SHA" HEAD
